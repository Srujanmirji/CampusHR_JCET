services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campushr
      POSTGRES_USER: campushr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campushr -d campushr']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
